[package]
name = "jav"
version = "2026.928.1"
edition = "2021"
description = "A modern CLI for Java projects"
license = "MIT"

[dependencies]
anyhow = "1.0.95"
anstream = "1.0.0"
clap = { version = "4.5.27", features = ["derive"] }
console = "0.16.3"
ctrlc = { version = "3.4", features = ["termination"] }
dialoguer = "0.12.0"
flate2 = "1.1.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
semver = "1.0"
sha2 = "0.11.0"
tar = "0.4.44"
tera = "1.20.0"
tempfile = "3.15.0"
toml = "1.1.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2.0.16"
assert_fs = "1.1.2"
predicates = "3.1.3"
