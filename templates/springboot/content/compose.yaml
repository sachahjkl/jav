services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: {{ project_name }}
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d {{ project_name }}"]
      interval: 2s
      timeout: 5s
      retries: 20
